<!--
  Vigbo → Настройки → Сторонний код → футер
  Заменить старый:
    <script src="https://primerka.soco-salon.ru/static/embed_tryon_link.js"></script>
  на этот блок.

  Если VPS/primerka недоступен — сайты soco-* всё равно грузятся;
  не подтянется только аналитика (ym_cid / UTM на кнопках).
-->
<script>
(function () {
  function loadTryonEmbed() {
    var s = document.createElement("script");
    s.src = "https://primerka.soco-salon.ru/static/embed_tryon_link.js?v=50";
    s.async = true;
    s.defer = true;
    s.onerror = function () {};
    (document.head || document.documentElement).appendChild(s);
  }
  if (document.readyState === "complete") setTimeout(loadTryonEmbed, 0);
  else window.addEventListener("load", function () { setTimeout(loadTryonEmbed, 0); });
})();
</script>
