# SOCO AI try-on — put behind HTTPS subdomain.
# DNS: A-record tryon.YOUR-DOMAIN → VPS IP (deploy/vps.host)
# Also keeps legacy http://VPS_IP:8088 working via nginx → uvicorn.

upstream soco_tryon {
    server 127.0.0.1:18088;
    keepalive 8;
}

# Legacy public port (old shared links)
server {
    listen 8088;
    listen [::]:8088;
    server_name _;

    client_max_body_size 12m;

    location / {
        proxy_pass http://soco_tryon;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# Domain (HTTP → later certbot adds HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name tryon.soco-salon.ru;

    client_max_body_size 12m;

    location /static/ {
        proxy_pass http://soco_tryon;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
    }

    location / {
        proxy_pass http://soco_tryon;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
